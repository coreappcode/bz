# Project-wide Gradle settings tuned for low-memory CI containers.

# JVM arguments for the daemon process - kept small for 4 GB hosts.
org.gradle.jvmargs=-Xmx1024m -Xms128m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=true
android.experimental.art.profiles.enabled=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=35,36
